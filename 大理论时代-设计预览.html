<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大理论时代 · 设计预览 v2</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --wood:#8B5E3C;
    --wood-d:#4A2E18;
    --wood-m:#5E3C22;
    --wood-l:#B5854F;
    --tan:#F7E3BC;
    --cream:#FFF9E8;
    --cream-2:#FBEECB;
    --ring:#E8C68C;
    --ink:#3E2410;
    --ink-2:#7C5836;
    --water:#3C97D4;
    --fire:#D9542B;
    --night:#7B5EA7;
    --rock:#4FA83D;
    --gold:#FFC845;
  }
  body{
    font-family:"Varela Round","Nunito","Quicksand","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:var(--cream);background:var(--wood);
    background-image:
      repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 3px,transparent 3px 48px),
      repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 140px);
    padding:38px 28px 80px;position:relative;
  }
  .head{max-width:1180px;margin:0 auto 30px}
  .head h1{font-size:24px;letter-spacing:2px;color:#FFE9A8;text-shadow:0 3px 0 var(--wood-d)}
  .head p{font-size:12px;color:#E9CFA4;margin-top:8px;letter-spacing:.5px}
  .badge{display:inline-block;margin-top:12px;font-size:11px;font-weight:700;color:var(--ink);
    border:3px solid var(--wood-d);border-radius:10px;background:var(--gold);
    padding:4px 12px;box-shadow:0 3px 0 var(--wood-d)}
  .grid{max-width:1180px;margin:0 auto;display:grid;
    grid-template-columns:repeat(auto-fill,322px);gap:44px 36px;justify-content:start}
  figure{display:flex;flex-direction:column;gap:10px}
  figcaption{font-size:12px;font-weight:700;letter-spacing:1px;color:#FFE9A8}
  figcaption span{font-weight:400;color:#D8BB8C;margin-left:8px;letter-spacing:0}

  .phone{
    width:322px;height:646px;background:var(--tan);
    border:4px solid var(--wood-d);border-radius:20px;
    box-shadow:0 9px 0 rgba(0,0,0,.30);
    position:relative;overflow:hidden;display:flex;flex-direction:column;
  }
  .sb{height:22px;display:flex;align-items:center;justify-content:space-between;
    padding:0 12px;font-size:9px;font-weight:700;color:var(--ink-2);flex:0 0 auto}
  .body{flex:1;overflow:hidden;display:flex;flex-direction:column}
  .pad{padding:12px 14px}
  .row{display:flex;align-items:center}
  .between{justify-content:space-between}
  .gap8{gap:8px}.gap6{gap:6px}.gap4{gap:4px}

  .card{background:var(--cream);border:3px solid var(--wood-m);border-radius:12px;
    box-shadow:inset 0 0 0 2px var(--ring),0 4px 0 rgba(94,60,34,.35)}
  .card.flat{box-shadow:inset 0 0 0 2px var(--ring)}
  .num{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:.3px}
  .t10{font-size:10px}.t11{font-size:11px}.t12{font-size:12px}.t13{font-size:13px}
  .t16{font-size:16px}.t20{font-size:20px}.t26{font-size:26px}.t34{font-size:34px}
  .b7{font-weight:800}
  .dim{color:var(--ink-2)}
  .ic{width:19px;height:19px;display:block}
  .ic.sm{width:14px;height:14px}

  .tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--wood-m);
    border-top:3px solid var(--wood-d);flex:0 0 auto;padding:3px 4px 5px;gap:3px}
  .tab{padding:6px 0 7px;text-align:center;font-size:10px;font-weight:700;color:#E4C79B;
    display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:9px}
  .tab.on{background:var(--gold);color:var(--wood-d);box-shadow:0 2px 0 var(--wood-d)}
  .tab .ic{width:15px;height:15px}

  .seg{display:flex;gap:3px;height:13px}
  .seg i{flex:1;border:2px solid var(--wood-m);border-radius:4px;background:var(--cream-3);
    display:block}
  .seg i.f{background:var(--c)}

  .btn{border:3px solid var(--wood-m);border-radius:11px;background:var(--gold);color:var(--wood-d);
    font-weight:800;font-size:12px;padding:9px 0;text-align:center;
    box-shadow:0 4px 0 var(--wood-m);font-family:inherit}
  .btn.solid{background:var(--rock);color:#FFFCEF}
  .btn.ghost{background:var(--cream-2);color:var(--ink)}
  .btn.tiny{font-size:11px;padding:5px 11px;box-shadow:0 3px 0 var(--wood-m)}

  .stripe{background:var(--wood-m);color:var(--gold);font-size:11px;font-weight:800;
    letter-spacing:1.5px;padding:8px 0;text-align:center;border-bottom:3px solid var(--wood-d)}

  .cell{border:2px solid var(--wood-m);border-radius:9px;padding:6px 2px 5px;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;
    background:var(--cream);color:var(--ink)}
  .cell.on{background:var(--fire);color:#FFFCEF;border-color:var(--wood-m);
    box-shadow:0 3px 0 rgba(94,60,34,.4)}
  .cell .ic{color:var(--ink)}
  .cell.on .ic{color:#FFFCEF}

  .avatar{width:28px;height:28px;border:3px solid var(--wood-m);border-radius:8px;
    background:var(--cream-2);display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:var(--ink);flex:0 0 auto}

  /* 开屏 */
  .sp-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:24px;background:var(--wood-m);
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 3px,transparent 3px 42px)}
  .logo-box{border:4px solid var(--wood-d);border-radius:18px;background:var(--cream);
    box-shadow:inset 0 0 0 3px var(--ring),0 6px 0 rgba(0,0,0,.3);padding:41px 35px 40px}
  .cursor{display:inline-block;width:9px;height:15px;background:var(--gold);vertical-align:-2px;
    margin-left:3px;border-radius:2px}
  .bar-load{display:flex;gap:4px}
  .bar-load i{width:16px;height:10px;border:2px solid var(--wood-d);border-radius:3px;
    background:rgba(255,255,255,.14)}
  .bar-load i.f{background:var(--gold)}

  /* ── 封面角色动画：3 帧精灵循环，1.05s 一个回合 ── */
  .hero-anim{display:block;shape-rendering:crispEdges}
  .f1,.f2,.f3{opacity:0}
  .f1{animation:fa 1.05s steps(1,end) infinite}
  .f2{animation:fb 1.05s steps(1,end) infinite}
  .f3{animation:fc 1.05s steps(1,end) infinite}
  @keyframes fa{0%{opacity:1}33.3%{opacity:0}100%{opacity:0}}
  @keyframes fb{0%{opacity:0}33.3%{opacity:1}66.6%{opacity:0}100%{opacity:0}}
  @keyframes fc{0%{opacity:0}66.6%{opacity:1}100%{opacity:1}}
  .bob{animation:bob 1.05s steps(1,end) infinite}
  @keyframes bob{0%{transform:translateY(0)}33.3%{transform:translateY(-1px)}
    66.6%{transform:translateY(-2px)}100%{transform:translateY(0)}}
  .sp{animation:sp 1.05s steps(1,end) infinite;opacity:0}
  @keyframes sp{0%{opacity:0}60%{opacity:0}66.6%{opacity:1}94%{opacity:1}100%{opacity:0}}
</style>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>大理论时代 · 可点击试用原型</title>
<style>
  :root{
    --wood-d:#4A2E18; --wood:#5E3C22; --wood-l:#8B5E3C;
    --wheat:#F7E3BC; --cream:#FFF9E8; --ring:#E8C68C;
    --ink:#3E2410; --ink-2:#7C5836;
    --water:#3C97D4; --fire:#D9542B; --night:#7B5EA7; --grass:#4FA83D; --gold:#FFC845;
    --r-card:12px; --r-btn:11px; --r-cell:9px;
    --sc:1;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#2A1B10;
    font-family:"Varela Round","Nunito","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    display:flex;justify-content:center;align-items:flex-start;
    padding:16px;overflow:hidden;
  }
  /* ---------------- 左侧说明 ---------------- */
  .side{width:250px;flex:none;color:var(--wheat);font-size:12px;line-height:1.75;padding-top:6px}
  .side h1{font-size:17px;color:#FFF9E8;letter-spacing:1px;margin-bottom:2px}
  .side .sd{font-size:11px;opacity:.6;margin-bottom:14px}
  .side .box{border:2px solid #5E3C22;border-radius:10px;padding:10px;background:rgba(255,249,232,.05);margin-bottom:10px}
  .side .box b{color:var(--gold);display:block;margin-bottom:4px;font-size:12px}
  .side .box p{font-size:11px;opacity:.85;line-height:1.7}
  .sbtn{width:100%;height:34px;border:2px solid #8B5E3C;border-radius:8px;background:#3A2415;
    color:var(--wheat);font-size:12px;font-weight:800;font-family:inherit;cursor:pointer;margin-bottom:6px}
  .sbtn:hover{background:#4A2E18;border-color:var(--gold)}
  .sbtn:active{transform:translateY(1px)}
  .jump{display:flex;flex-wrap:wrap;gap:4px}
  .jump span{font-size:11px;padding:3px 7px;border:1px solid #5E3C22;border-radius:6px;cursor:pointer;opacity:.8}
  .jump span:hover{border-color:var(--gold);color:var(--gold);opacity:1}

  /* ---------------- 手机框 ---------------- */
  .phone-wrap{width:calc(375px * var(--sc));height:calc(760px * var(--sc));flex:none;position:relative}
  .phone{
    width:375px;height:760px;border-radius:34px;border:8px solid #1A1108;
    background:var(--wood-l);position:relative;overflow:hidden;
    display:flex;flex-direction:column;
    transform:scale(var(--sc));transform-origin:top left;
    box-shadow:0 18px 44px rgba(0,0,0,.6);
  }
  .status{height:24px;flex:none;background:var(--wood);display:flex;align-items:center;
    justify-content:space-between;padding:0 16px;font-size:10px;font-weight:800;color:var(--cream)}
  .status .dots{letter-spacing:1px;font-size:9px;opacity:.85}

  .nav{flex:none;background:var(--wood);border-bottom:3px solid var(--wood-d);display:flex;
    align-items:center;height:46px;padding:0 10px;box-shadow:inset 0 -3px 0 rgba(255,255,255,.05)}
  .nav__side{width:58px;flex:none;display:flex;align-items:center}
  .nav__side--r{justify-content:flex-end}
  .nav__mid{flex:1;text-align:center;min-width:0}
  .nav__title{font-size:15px;font-weight:800;color:var(--cream);letter-spacing:.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav__sub{font-size:9px;color:var(--wheat);opacity:.8;margin-top:1px}
  .nav__back{width:28px;height:28px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;cursor:pointer}
  .nav__back:active{background:rgba(0,0,0,.25)}
  .nav__back img{width:16px;height:16px;image-rendering:pixelated}
  .score{display:flex;align-items:baseline;gap:1px;background:var(--cream);border:2px solid var(--wood-d);
    border-radius:8px;padding:1px 6px}
  .score b{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
  .score i{font-size:9px;font-weight:800;color:var(--ink-2);font-style:normal}

  /* ---------------- 页面容器 ---------------- */
  .view{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 12px 18px;
    background:var(--wood-l);
    background-image:repeating-linear-gradient(180deg,
      rgba(0,0,0,.045) 0px,rgba(0,0,0,.045) 2px,
      rgba(255,255,255,.035) 2px,rgba(255,255,255,.035) 6px);
    -webkit-overflow-scrolling:touch;position:relative}
  .view::-webkit-scrollbar{width:0}
  .view--flush{padding:0}
  .view--tab{padding-bottom:12px}

  /* ---------------- 通用 ---------------- */
  .card{background:var(--cream);border:3px solid var(--wood);border-radius:12px;
    box-shadow:inset 0 0 0 2px var(--ring),0 4px 0 rgba(0,0,0,.28);
    padding:10px 11px;position:relative;overflow:hidden}
  .card+.card{margin-top:9px}
  .card__acc{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--wood)}
  .h3{font-size:13px;font-weight:800}
  .sub{font-size:10px;color:var(--ink-2);line-height:1.6}
  .row{display:flex;align-items:center}
  .btw{display:flex;align-items:center;justify-content:space-between}
  .grow{flex:1;min-width:0}
  .mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}
  .tag{display:inline-flex;align-items:center;justify-content:center;padding:1px 7px;border-radius:7px;
    font-size:10px;font-weight:800;border:2px solid var(--wood);background:var(--cream);white-space:nowrap}
  .tag--on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  .tag--gold{background:var(--gold);border-color:var(--wood)}
  .iico{width:28px;height:28px;flex:none;border-radius:7px;border:2px solid var(--wood);
    display:flex;align-items:center;justify-content:center}
  .iico img{width:18px;height:18px;image-rendering:pixelated}
  .bg-water{background:var(--water)}.bg-fire{background:var(--fire)}
  .bg-night{background:var(--night)}.bg-grass{background:var(--grass)}
  .num{font-variant-numeric:tabular-nums;font-weight:800}

  .btn{height:44px;border:3px solid var(--wood);border-radius:11px;background:var(--cream);
    box-shadow:0 4px 0 rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;gap:5px;
    font-size:14px;font-weight:800;color:var(--ink);cursor:pointer;user-select:none;
    font-family:inherit;transition:transform .06s linear,box-shadow .06s linear}
  .btn:active{transform:translate(1px,3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
  .btn--sm{height:34px;font-size:12px;border-radius:9px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
  .btn--gold{background:var(--gold)}
  .btn--dark{background:var(--ink);color:var(--cream)}
  .btn--off{opacity:.45;pointer-events:none}
  .btn img{width:15px;height:15px;image-rendering:pixelated}
  .btns{display:flex;gap:8px}
  .btns>.btn{flex:1}

  .inp{width:100%;height:40px;border:3px solid var(--wood);border-radius:9px;background:var(--wheat);
    font-family:inherit;font-size:15px;font-weight:800;color:var(--ink);padding:0 10px;outline:none}
  .inp:focus{border-color:var(--gold);background:#FFF3D2}
  .inp--err{border-color:var(--fire)}
  .field{margin-bottom:10px}
  .field__label{font-size:11px;font-weight:800;color:var(--ink-2);margin-bottom:4px}
  .field__err{font-size:10px;font-weight:800;color:var(--fire);margin-top:3px}

  .seg{display:flex;gap:6px}
  .seg__i{flex:1;height:38px;display:flex;align-items:center;justify-content:center;
    border:3px solid var(--wood);border-radius:9px;background:var(--cream);
    font-size:12px;font-weight:800;cursor:pointer}
  .seg__i.on{background:var(--ink);color:var(--cream)}
  .seg__i:active{transform:translateY(1px)}

  .pc{flex:1;height:11px;border-radius:3px;background:var(--ring);
    border:1px solid rgba(94,60,34,.35)}
  .pcs{display:flex;gap:2px;align-items:center}

  .hint{margin-top:10px;text-align:center;font-size:11px;font-weight:800;color:#8A5A00}
  .foot{text-align:center;font-size:9px;color:var(--wheat);opacity:.8;margin-top:10px;line-height:1.6}

  /* ---------------- 底部 Tab ---------------- */
  .tabbar{flex:none;height:58px;background:var(--cream);border-top:3px solid var(--wood);
    box-shadow:inset 0 3px 0 var(--ring);display:flex;padding:4px 6px 3px}
  .tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border-radius:9px;cursor:pointer}
  .tb img{width:19px;height:19px;image-rendering:pixelated}
  .tb span{font-size:10px;font-weight:800;color:var(--ink-2)}
  .tb.on{background:var(--ink)}
  .tb.on span{color:var(--cream)}

  /* ---------------- 开屏 ---------------- */
  .splash{position:absolute;inset:0;background:var(--wood-d);display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:40}
  .logo-box{width:128px;height:160px;border:4px solid var(--wood);border-radius:16px;
    background:var(--cream);box-shadow:inset 0 0 0 3px var(--ring),0 6px 0 rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;position:relative}
  .hero{width:50px;height:70px;background-image:url("miniprogram/assets/splash/hero-3f.png");
    background-size:150px 70px;background-repeat:no-repeat;
    animation:heroGo 1.05s steps(3) infinite;image-rendering:pixelated}
  @keyframes heroGo{from{background-position:0 0}to{background-position:-150px 0}}
  .spark{position:absolute;width:100%;height:100%;pointer-events:none}
  .spark i{position:absolute;width:5px;height:5px;background:var(--gold);opacity:0;
    animation:sp 1.05s steps(3) infinite}
  .spark i:nth-child(1){left:16px;top:30px}
  .spark i:nth-child(2){left:24px;top:22px;animation-delay:0s}
  .spark i:nth-child(3){right:16px;top:30px}
  .spark i:nth-child(4){right:24px;top:22px}
  @keyframes sp{0%,66%{opacity:0}67%,100%{opacity:1}}
  .type{margin-top:26px;min-height:20px;font-size:13px;font-weight:800;letter-spacing:2px;
    color:var(--gold);font-family:"Varela Round","PingFang SC",sans-serif}
  .type .cur{display:inline-block;width:8px;height:12px;background:var(--gold);
    vertical-align:-1px;margin-left:2px;animation:blink .6s steps(1) infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .load{display:flex;gap:4px;margin-top:28px}
  .load i{width:16px;height:7px;border:1px solid var(--gold);border-radius:2px}
  .load i.on{background:var(--gold)}
  .skip{position:absolute;bottom:34px;font-size:10px;color:var(--wheat);opacity:.6;letter-spacing:1px}

  /* ---------------- 底部弹层 ---------------- */
  .mask{position:absolute;inset:0;background:rgba(26,17,8,.6);display:flex;align-items:flex-end;z-index:60}
  .sheet{width:100%;background:var(--cream);border-top:3px solid var(--wood);
    border-radius:16px 16px 0 0;box-shadow:inset 0 3px 0 var(--ring);padding:14px 14px 20px;
    animation:up .16s linear}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:translateY(0);opacity:1}}
  .sheet__t{font-size:14px;font-weight:800;margin-bottom:4px}
  .sheet__d{font-size:10px;color:var(--ink-2);line-height:1.6;margin-bottom:10px}

  .toast{position:absolute;left:50%;top:78px;transform:translateX(-50%);background:var(--ink);
    color:var(--cream);padding:7px 13px;border-radius:9px;font-size:11px;font-weight:800;z-index:90;
    white-space:nowrap;border:2px solid var(--gold);animation:tin .12s linear}
  @keyframes tin{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
  .award{position:absolute;right:12px;top:52px;color:var(--gold);font-size:15px;font-weight:800;
    text-shadow:1px 1px 0 var(--ink);animation:fly .95s linear forwards;z-index:70;pointer-events:none}
  @keyframes fly{0%{opacity:0;transform:translateY(6px)}25%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}

  /* ---------------- 大水 ---------------- */
  .slogan{background:var(--wood-d);border:3px solid var(--wood);border-radius:10px;
    padding:6px 0;text-align:center;font-size:12px;font-weight:800;letter-spacing:2px;color:var(--gold)}
  .bwrap{position:relative;width:134px;height:186px}
  .bucket{width:134px;height:186px;position:relative;border:4px solid var(--wood-d);border-radius:14px;
    background:var(--wheat);overflow:hidden;
    box-shadow:inset 0 0 0 2px var(--ring),0 5px 0 rgba(0,0,0,.28)}
  .bucket__fill{position:absolute;left:0;right:0;bottom:0;background:var(--water);
    transition:height .3s steps(4)}
  .bucket__fill::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:#74C2EE}
  .bucket__ticks{position:absolute;inset:14px 0;display:flex;flex-direction:column;justify-content:space-between}
  .bucket__ticks i{height:2px;margin:0 10px;background:rgba(62,36,16,.2)}
  .bucket__mark{position:absolute;left:-7px;right:-7px;height:5px;background:var(--ink);
    border-radius:2px;transition:bottom .3s steps(4);z-index:3}
  .bucket__goal{position:absolute;left:4px;right:4px;border-top:2px dashed var(--ink);z-index:2;opacity:.55}
  .big{font-size:38px;font-weight:800;line-height:1.05;color:var(--water);font-variant-numeric:tabular-nums}

  /* ---------------- 抗炎 ---------------- */
  .acells{display:flex;flex-wrap:wrap;margin-top:6px}
  .acell{width:25%;padding:3px 2px}
  .acell__box{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 1px 5px;
    border:2px solid transparent;border-radius:9px;cursor:pointer;transition:background .08s linear}
  .acell__box img{width:24px;height:24px;image-rendering:pixelated}
  .acell__box span{font-size:9px;font-weight:800;color:var(--ink-2);white-space:nowrap;transform:scale(.94)}
  .acell__box:active{transform:scale(.96)}
  .acell__box.on{border-color:var(--wood)}
  .acell__box.on span{color:var(--cream)}

  /* ---------------- 大睡 ---------------- */
  .moon-wrap{display:flex;justify-content:center;align-items:center;height:96px;position:relative}
  .moon{width:64px;height:64px;border-radius:50%;background:var(--gold);
    box-shadow:inset -6px -6px 0 rgba(0,0,0,.08);position:relative;transition:transform .4s steps(4)}
  .moon::after{content:"";position:absolute;width:56px;height:56px;border-radius:50%;
    background:var(--cream);left:-16px;top:-8px}
  .moon-glow{position:absolute;width:88px;height:88px;border-radius:50%;
    box-shadow:0 0 0 4px rgba(255,200,69,.18),0 0 0 12px rgba(255,200,69,.08)}
  .moon-cv{width:72px;height:72px;image-rendering:pixelated;image-rendering:crisp-edges;position:relative}
  .time-box{flex:1;background:var(--wheat);border:3px solid var(--wood);border-radius:9px;
    padding:6px 4px;text-align:center;font-size:15px;font-weight:800;cursor:pointer}
  .time-box .lb{font-size:9px;color:var(--ink-2);font-weight:800;display:block;margin-bottom:1px}
  .time-box input{border:0;background:transparent;font-family:inherit;font-size:15px;font-weight:800;
    color:var(--ink);text-align:center;width:100%;outline:none}

  /* ---------------- 薄肌 ---------------- */
  .ex{display:flex;align-items:center;padding:8px 2px;border-bottom:2px dashed rgba(94,60,34,.2)}
  .ex:last-child{border-bottom:0}
  .ex__t{font-size:12px;font-weight:800}
  .ex__d{font-size:9px;color:var(--ink-2);margin-top:1px}
  .mini{height:26px;padding:0 8px;border:2px solid var(--wood);border-radius:7px;background:var(--gold);
    font-size:10px;font-weight:800;display:flex;align-items:center;cursor:pointer;font-family:inherit;color:var(--ink)}
  .mini:active{transform:translateY(1px)}
  .mini--ghost{background:var(--cream)}

  /* ---------------- 趋势 ---------------- */
  .sum{display:flex;gap:7px;margin-top:9px}
  .sum__i{flex:1;background:var(--cream);border:3px solid var(--wood);border-radius:10px;
    box-shadow:inset 0 0 0 2px var(--ring);padding:7px 5px;text-align:center}
  .sum__v{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
  .sum__l{font-size:9px;color:var(--ink-2);font-weight:800;margin-top:1px}
  .chart-card{padding:9px 9px 6px}
  .chart-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
  .chart-title b{font-size:11px}
  .chart-title span{font-size:9px;color:var(--ink-2);font-weight:800}
  canvas{display:block;width:100%;image-rendering:pixelated}

  /* ---------------- 榜单 ---------------- */
  .rk{display:flex;align-items:center;padding:8px 8px;border-radius:9px;margin-top:6px}
  .rk--me{border:2px solid var(--water);background:#E6F3FC}
  .rk--top{background:#FFF1CC}
  .rk__n{width:22px;font-size:12px;font-weight:800;color:var(--ink-2);text-align:center;flex:none}
  .rk__a{width:26px;height:26px;border-radius:6px;border:2px solid var(--wood);margin:0 7px 0 2px;
    image-rendering:pixelated;flex:none;background:var(--wheat)}
  .rk__nm{font-size:12px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rk__p{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
  .rk__c{width:16px;height:16px;image-rendering:pixelated;margin-left:3px}

  /* ---------------- 我的 ---------------- */
  .me-hd{display:flex;align-items:center;gap:10px}
  .me-av{width:52px;height:52px;border-radius:10px;border:3px solid var(--wood);background:var(--wheat);
    image-rendering:pixelated;flex:none}
  .menu{background:var(--cream);border:3px solid var(--wood);border-radius:12px;
    box-shadow:inset 0 0 0 2px var(--ring),0 4px 0 rgba(0,0,0,.28);margin-top:9px;overflow:hidden}
  .menu__i{display:flex;align-items:center;padding:11px 11px;border-bottom:2px solid rgba(94,60,34,.14);cursor:pointer}
  .menu__i:last-child{border-bottom:0}
  .menu__i:active{background:var(--wheat)}
  .menu__t{font-size:12px;font-weight:800;flex:1}
  .menu__v{font-size:11px;color:var(--ink-2);font-weight:800}
  .menu__ar{font-size:13px;color:var(--ink-2);margin-left:6px}

  /* 开关 */
  .sw{width:44px;height:24px;border:3px solid var(--wood);border-radius:7px;background:var(--ring);
    position:relative;cursor:pointer;flex:none;transition:background .1s linear}
  .sw i{position:absolute;top:1px;left:1px;width:16px;height:16px;background:var(--cream);
    border:2px solid var(--wood);border-radius:4px;transition:left .1s linear}
  .sw.on{background:var(--grass)}
  .sw.on i{left:19px}

  @media (max-width:900px){
    .side{display:none}
    body{align-items:center;overflow:auto}
  }
</style>
</head>
<body>

<div class="side">
  <h1>大理论时代</h1>
  <div class="sd">可点击试用原型 · v1.0</div>

  <div class="box">
    <b>怎么玩</b>
    <p>直接点界面。喝水、选抗炎食物、填睡眠、记训练都会真的存下来，分数会实时加。刷新页面数据还在。</p>
  </div>
  <div class="box">
    <b>说明</b>
    <p>这是网页版原型，交互和视觉与小程序一致；真机数据存在手机本地，不联网。榜单在原型里用模拟好友演示。</p>
  </div>

  <button class="sbtn" data-act="seed">填入 14 天演示数据</button>
  <button class="sbtn" data-act="reset">清空并回到开屏</button>

  <div class="box">
    <b>快速跳转</b>
    <div class="jump">
      <span data-act="jump" data-to="splash">开屏</span>
      <span data-act="jump" data-to="onboard">引导</span>
      <span data-act="jump" data-to="home">今日</span>
      <span data-act="jump" data-to="water">大水</span>
      <span data-act="jump" data-to="anti">抗炎</span>
      <span data-act="jump" data-to="sleep">大睡</span>
      <span data-act="jump" data-to="muscle">薄肌</span>
      <span data-act="jump" data-to="trend">趋势</span>
      <span data-act="jump" data-to="rank">榜单</span>
      <span data-act="jump" data-to="me">我的</span>
    </div>
  </div>
</div>

<div class="phone-wrap">
  <div class="phone" id="phone">
    <div class="status">
      <span id="clock">9:41</span>
      <span class="dots">●●● ▮</span>
    </div>
    <div id="nav"></div>
    <div class="view" id="view"></div>
    <div id="tabbar"></div>
    <div id="layer"></div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============================================================ 常量 */
var CFG={WATER_MIN:1.5, ANTI:3, SLEEP_FULL:480, PTS:10, MAX:40};
var ICON='miniprogram/assets/icons/';
var AV='miniprogram/assets/avatar/';
var HEX={water:'#3C97D4',fire:'#D9542B',night:'#7B5EA7',grass:'#4FA83D',gold:'#FFC845'};
var ANTI_CATS=[

/* ============================================================ 日期 */
function pad(n){return n<10?'0'+n:''+n;}
function dayKey(d){var x=d||new Date();return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());}
function fromKey(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(k,n){var d=fromKey(k);d.setDate(d.getDate()+n);return dayKey(d);}
function weekStart(k){var d=fromKey(k||dayKey());var wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return dayKey(d);}
function lastN(n,end){var out=[],e=end||dayKey();for(var i=n-1;i>=0;i--)out.push(addDays(e,-i));return out;}
function toMin(hm){if(!hm)return 0;var p=String(hm).split(':');return Number(p[0])*60+Number(p[1]||0);}
function durMin(b,w){if(!b||!w)return 0;var d=toMin(w)-toMin(b);if(d<=0)d+=1440;return d;}
function fmtDur(m){if(!m||m<=0)return '--';var h=Math.floor(m/60),mm=Math.round(m%60);return h?(h+'时'+(mm?mm+'分':'')):(mm+'分');}
function md(k){var d=fromKey(k);return (d.getMonth()+1)+'月'+d.getDate()+'日';}
function wd(k){return ['周日','周一','周二','周三','周四','周五','周六'][fromKey(k).getDay()];}

/* ============================================================ 数据层 */
function blank(){
  return {water:0,anti:{breakfast:[],lunch:[],dinner:[]},
    sleep:{bed:'',wake:'',durationMin:0,quality:null},muscle:[],weightKg:null,calories:null};
}
function readDay(k){
  var b=blank(), d=S.days[k];
  if(!d) return b;
  return {
    water:Number(d.water)||0,
    anti:{breakfast:(d.anti&&d.anti.breakfast)||[],lunch:(d.anti&&d.anti.lunch)||[],dinner:(d.anti&&d.anti.dinner)||[]},
    sleep:Object.assign({},b.sleep,d.sleep||{}),
    muscle:Array.isArray(d.muscle)?d.muscle:[],
    weightKg:(d.weightKg==null?null:Number(d.weightKg)),
    calories:(d.calories==null?null:Number(d.calories))
  };
}
function writeDay(k,patch){
  var cur=readDay(k);
  S.days[k]=Object.assign(cur,patch,{upd:Date.now()});
  save();
}
function antiCount(k){
  var d=readDay(k),set={};
  MEALS.forEach(function(m){(d.anti[m.k]||[]).forEach(function(c){set[c]=1;});});
  return Object.keys(set).length;
}
function waterGoal(){
  var t=T(), g=Number(t.waterGoalL);
  if(!g||isNaN(g)){
    var p=S.profile;
    g=(p&&p.weightKg)?Math.max(CFG.WATER_MIN,Math.round(p.weightKg*0.0325*10)/10):CFG.WATER_MIN;
  }
  return Math.round(g*10)/10;
}
function fmtL(x){
  var v=Math.round(x*10)/10;
  return (v%1===0)?v.toFixed(0):v.toFixed(1);
}
/* 判定、进度、文案、得分全部走这一个函数，避免四处各写一套 */
function mState(m,k){
  var d=readDay(k);
  if(m==='water'){
    var g=waterGoal(), v=d.water, ok=v>=g-1e-9;
    return {done:ok, ratio:Math.min(1,v/g), main:v.toFixed(1), sub:'升 / '+fmtL(g)+' 升',
      tag:ok?'达标':'还差 '+fmtL(g-v)+' 升'};
  }
  if(m==='anti'){
    var n=antiCount(k), ok2=n>=CFG.ANTI;
    return {done:ok2, ratio:Math.min(1,n/CFG.ANTI), main:String(n),
      sub:'类 / '+CFG.ANTI+' 类合格', tag:ok2?'合格':'未合格'};
  }
  if(m==='sleep'){
    var done=!!(d.sleep.bed&&d.sleep.wake&&d.sleep.quality);
    var mins=d.sleep.durationMin||0;
    return {done:done, ratio:done?1:Math.min(0.95,mins/CFG.SLEEP_FULL),
      main:fmtDur(mins), sub:done?'昨晚':'待填完',
      tag:done?'已完成':(mins?'缺自评':'未记录')};
  }
  var today=d.muscle.length, mw=muscleWeek(k), tw=T().strengthPerWeek||3;
  return {done:today>0, ratio:Math.min(1,mw/tw), main:String(mw), sub:'次 / 本周 '+tw+' 次',
    tag:today>0?'今日已练':'未练'};
}
function isDone(m,k){
  var d=readDay(k);
  if(m==='water') return d.water>=waterGoal()-1e-9;
  if(m==='anti') return antiCount(k)>=CFG.ANTI;
  if(m==='sleep') return !!(d.sleep.bed&&d.sleep.wake&&d.sleep.quality);
  if(m==='muscle') return d.muscle.length>0;
  return false;
}
function muscleWeek(k){
  var s=weekStart(k),e=addDays(s,6),n=0;
  Object.keys(S.days).forEach(function(x){
    if(x>=s&&x<=e&&(S.days[x].muscle||[]).length>0)n++;
  });
  return n;
}
function muscleWeekMin(k){
  var s=weekStart(k),e=addDays(s,6),n=0;
  Object.keys(S.days).forEach(function(x){
    if(x>=s&&x<=e)(S.days[x].muscle||[]).forEach(function(m){n+=Number(m.minutes)||0;});
  });
  return n;
}
function pointsOn(k){
  return S.points.filter(function(p){return p.date===k;}).reduce(function(s,p){return s+(p.points||0);},0);
}
function pointsRange(a,b){
  return S.points.filter(function(p){return p.date>=a&&p.date<=b;}).reduce(function(s,p){return s+(p.points||0);},0);
}
function pointsAll(){ return S.points.reduce(function(s,p){return s+(p.points||0);},0); }
function hasPoint(k,m){ return S.points.some(function(p){return p.date===k&&p.module===m;}); }

function award(k){
  var TODAY=dayKey();
  if(k!==TODAY) return [];              /* 补记不给分 */
  var got=[];
  ['water','anti','sleep','muscle'].forEach(function(m){
    if(isDone(m,k)&&!hasPoint(k,m)){
      S.points.push({date:k,module:m,points:CFG.PTS});
      got.push(m);
    }
  });
  if(got.length) save();
  return got;
}

function calcTargets(p){
  var k={sedentary:1.2,light:1.375,moderate:1.55,high:1.725}[p.activity]||1.55;
  var sh=SHAPE[p.bodyGoal]||SHAPE.keep;
  var bmr=10*p.weightKg+6.25*p.heightCm-5*p.age+(p.sex==='female'?-161:5);
  var tdee=bmr*k;
  var waterL=Math.max(CFG.WATER_MIN, Math.round(p.weightKg*0.0325*10)/10);
  return {
    calories:Math.round((tdee+sh.k)/10)*10,
    waterGoalL:waterL,
    strengthPerWeek:sh.s, cardioPerWeek:sh.c,
    bmr:Math.round(bmr), tdee:Math.round(tdee)
  };
}
function T(){
  var p=S.profile;
  if(!p||!p.targets) return {calories:2400,waterGoalL:2.2,strengthPerWeek:3,cardioPerWeek:2,bmr:1560,tdee:2420};
  return p.targets;
}

  var my=++splashRun;
  var text='全民严肃进入大理论时代';
  var el=document.getElementById('type');
  if(!el) return;
  var i=0;
  var t=setInterval(function(){
    if(my!==splashRun) { clearInterval(t); return; }
    i++;
    el.innerHTML=text.slice(0,i)+'<span class="cur"></span>';
    if(i>=text.length){
      clearInterval(t);
      var load=document.getElementById('load');

        if(my!==splashRun){clearInterval(t2);return;}
        if(load&&c<3){ load.children[c].className='on'; c++; }
        else{
          clearInterval(t2);
          setTimeout(function(){ if(my!==splashRun)return; finishSplash(); },300);
        }
      },110);
    }
  },80);
}

function vTrend(){
  var n=route.p.n||7;
  var keys=lastN(n);
  var d7=keys.map(readDay);

  var wArr=d7.map(function(d){return d.weightKg;});
  var cArr=d7.map(function(d){return d.calories;});
  var waArr=d7.map(function(d){return d.water;});
  var sArr=d7.map(function(d){return d.sleep.durationMin||0;});
  var aArr=keys.map(function(k){return antiCount(k);});
  var mArr=d7.map(function(d){return d.muscle.reduce(function(s,m){return s+(+m.minutes||0);},0);});

  var sumW=(function(){var a=wArr.filter(function(x){return x!=null;});return a.length?a[a.length-1].toFixed(1):'--';})();
  var sumC=(function(){var a=cArr.filter(function(x){return x!=null;});return a.length?Math.round(a.reduce(function(s,x){return s+x;},0)/a.length):'--';})();
  var sumWater=waArr.reduce(function(s,x){return s+x;},0).toFixed(1);

  var h='<div class="card" style="padding:8px 6px"><div class="seg" style="gap:6px">'

    +'<div class="seg__i '+(n===30?'on':'')+'" data-act="trend-n" data-v="30" style="height:32px">近 30 天</div>'
    +'</div></div>';

  h+='<div class="sum">'
    +'<div class="sum__i"><div class="sum__v" style="color:'+HEX.grass+'">'+sumW+'</div><div class="sum__l">最新体重 kg</div></div>'
    +'<div class="sum__i"><div class="sum__v" style="color:'+HEX.fire+'">'+sumC+'</div><div class="sum__l">日均热量</div></div>'
    +'<div class="sum__i"><div class="sum__v" style="color:'+HEX.water+'">'+sumWater+'</div><div class="sum__l">累计饮水 L</div></div>'
    +'</div>';

  var rng=md(keys[0])+'|'+md(keys[keys.length-1]);

  h+=chartCard('抗炎','类 · 虚线为 3 类','cv-a',84,rng);

  h+='<div class="card mt2" style="padding:8px 10px"><div class="sub">最近 7 天</div>';
  keys.slice(-7).forEach(function(k){
    var d=readDay(k);
    h+='<div class="btw" data-act="day" data-k="'+k+'" style="padding:6px 2px;border-bottom:1px dashed rgba(94,60,34,.18);cursor:pointer">'
      +'<span style="font-size:11px;font-weight:800">'+md(k)+' '+wd(k)+'</span>'
      +'<span style="font-size:10px;font-weight:800;color:#7C5836">'

      +' <span style="color:#B7A489">›</span></span></div>';
  });
  h+='</div>';

  route.p._cache={keys:keys,wArr:wArr,cArr:cArr,waArr:waArr,sArr:sArr,aArr:aArr,mArr:mArr};
  return h;
}

/* ============================================================ 月相 */
/* 8 小时 = 月圆；其余按比例等分。逐格判断，保持像素硬边。 */
function drawMoonEl(){
  var cv=document.getElementById('moonCv');
  if(!cv||!cv.getContext) return;
  var d=readDay(dayKey());
  var mins=d.sleep.durationMin||0;
  var k=Math.min(1,Math.max(0,mins/CFG.SLEEP_FULL));
  var N=18, cell=cv.width/N, cx=N/2, cy=N/2, R=N/2-0.3;
  var g=cv.getContext('2d');
  g.clearRect(0,0,cv.width,cv.height);
  g.imageSmoothingEnabled=false;
  var LIT='#FFC845', DIM='#A08A63', EDGE='#4A2E18', CRATER='#E59C22';
  var sgn=(k<0.5)?(1-2*k):-(2*k-1);
  var isLit=function(nx,ny){
    var t=Math.sqrt(Math.max(0,1-ny*ny));
    return nx>sgn*t;
  };
  for(var y=0;y<N;y++){
    for(var x=0;x<N;x++){
      var nx=(x+0.5-cx)/R, ny=(y+0.5-cy)/R, dd=nx*nx+ny*ny;
      if(dd>1) continue;
      var col=(dd>0.84)?EDGE:(isLit(nx,ny)?LIT:DIM);
      g.fillStyle=col;
      g.fillRect(Math.round(x*cell),Math.round(y*cell),Math.round(cell),Math.round(cell));
    }
  }
  if(k>0.30){
    g.fillStyle=CRATER;
    [[11,10],[14,12],[12,14],[10,12]].forEach(function(q){
      var nx=(q[0]+0.5-cx)/R, ny=(q[1]+0.5-cy)/R;
      if(nx*nx+ny*ny<0.62&&isLit(nx,ny))
        g.fillRect(Math.round(q[0]*cell),Math.round(q[1]*cell),Math.round(cell),Math.round(cell));
    });
  }
  var sub=document.getElementById('moonSub');
  if(sub){
    sub.textContent=mins?('睡了 '+fmtDur(mins)+' · 月相 '+Math.round(k*100)+'%'):'还没填入睡和起床时间';
  }
}

}
function setupCv(cv){
  var dpr=window.devicePixelRatio>1?2:1;
  var w=cv.clientWidth||300, h=cv.clientHeight||80;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  var g=cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);
  return {g:g,w:w,h:h};
}
function drawLine(cv,vals,color,target,unit){
  var o=setupCv(cv),g=o.g,w=o.w,h=o.h,pad=8;
  var nums=vals.filter(function(v){return v!=null&&v>0;});
  if(!nums.length){
    g.fillStyle='#B7A489';g.font='10px sans-serif';g.textAlign='center';
    g.fillText('还没数据，去记一天看看',w/2,h/2-2);g.textAlign='left';return;
  }
  var max=Math.max.apply(null,nums), min=Math.min.apply(null,nums);
  if(target!=null){ max=Math.max(max,target); }
  min=Math.max(0,min-(max-min)*0.15);
  if(max===min){ max=min+1; }
  var X=function(i){ return pad+(w-pad*2)*(vals.length>1?i/(vals.length-1):0.5); };
  var Y=function(v){ return h-pad-((v-min)/(max-min))*(h-pad*2); };

  if(target!=null){
    g.strokeStyle='#C4A87E';g.lineWidth=1;g.setLineDash([4,3]);
    g.beginPath();g.moveTo(pad,Y(target));g.lineTo(w-pad,Y(target));g.stroke();
    g.setLineDash([]);
  }
  g.strokeStyle=color;g.lineWidth=2;g.lineJoin='miter';
  g.beginPath();
  var pen=false;
  vals.forEach(function(v,i){
    if(v==null||v<=0){pen=false;return;}
    var x=X(i),y=Y(v);
    if(!pen){g.moveTo(x,y);pen=true;} else g.lineTo(x,y);
  });
  g.stroke();
  if(vals.length<=14){
    vals.forEach(function(v,i){
      if(v==null||v<=0)return;
      g.fillStyle=color;g.fillRect(X(i)-2,Y(v)-2,4,4);
    });
  }
  g.fillStyle='#7C5836';g.font='8px sans-serif';
  g.fillText(Math.round(max)+'',1,9);
}
function drawBars(cv,vals,color,maxV){
  var o=setupCv(cv),g=o.g,w=o.w,h=o.h,pad=8;
  var has=vals.some(function(v){return v>0;});
  if(!has){
    g.fillStyle='#B7A489';g.font='10px sans-serif';g.textAlign='center';
    g.fillText('还没数据，去记一天看看',w/2,h/2-2);g.textAlign='left';return;
  }
  var max=Math.max(maxV||1,Math.max.apply(null,vals));
  var n=vals.length, gap=2, bw=Math.max(2,(w-pad*2-gap*(n-1))/n);
  vals.forEach(function(v,i){
    var x=pad+i*(bw+gap);
    var bh=Math.max(1,(v/max)*(h-pad*2));
    if(v>0){ g.fillStyle=color;g.fillRect(x,h-pad-bh,bw,bh); }
    else { g.strokeStyle='#C4A87E';g.lineWidth=1;g.strokeRect(x,h-pad-2,bw,2); }
  });
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el) return;
  var act=el.getAttribute('data-act');
  if(act==='close'){
    if(el.classList.contains('mask') && e.target.closest('.sheet')) return;
    closeSheet(); return;
  }
  var d=el.dataset;

  switch(act){
    /* --- 通用 --- */
    case 'go': go(d.to); break;
    case 'tab': tab(d.to); break;
    case 'back': back(); break;
    case 'jump': doJump(d.to); break;
    case 'seed': seedData(); break;
    case 'reset': resetAll(); break;
    case 'skip-splash': finishSplash(); break;
    case 'to-onboard': OB={step:1,sex:'',age:'',height:'',weight:'',activity:'',bodyGoal:'',nickname:'',avatarKey:'a01'}; go('onboard'); break;

    /* --- 引导 --- */

    case 'ob-act': OB.activity=d.v; refresh(); break;
    case 'ob-shape': OB.bodyGoal=d.v; refresh(); break;
    case 'ob-avatar': OB.avatarKey=d.v; refresh(); break;
    case 'ob-back': OB.step=1; refresh(); break;
    case 'ob-next':
      if(!ob1ok()){ toast('先把这几项填完'); break; }
      OB.step=2; refresh(); break;
    case 'ob-result':
      if(!OB.bodyGoal){ toast('选一个目标'); break; }
      OB.step=3; refresh(); break;
    case 'ob-finish': finishOnboard(); break;

    /* --- 大水 --- */
    case 'water-add': {
      var k=dayKey(), v=readDay(k).water;
      var nv=Math.min(10,Math.round((v+Number(d.v))*100)/100);
      writeDay(k,{water:nv});
      afterChange(); break;
    }
    case 'water-undo': {
      var k2=dayKey(), v2=readDay(k2).water;
      writeDay(k2,{water:Math.max(0,Math.round((v2-0.1)*100)/100)});
      afterChange(); break;
    }

        '<div class="field"><div class="field__label">今天一共喝了（升）</div>'
        +'<input class="inp" id="wset" type="number" step="0.05" min="0" max="10" value="'+readDay(dayKey()).water.toFixed(2)+'"></div>',
        '<div class="btns mt2"><button class="btn" data-act="close">取消</button>'
        +'<button class="btn btn--gold" data-act="water-save">保存</button></div>'));
      break;
    case 'water-save': {
      var iv=document.getElementById('wset');
      var vv=Math.max(0,Math.min(10,Number(iv&&iv.value)||0));

    }

    case 'anti': {
      var k3=dayKey(), dd=readDay(k3), meal=d.m, cat=d.c;
      var arr=(dd.anti[meal]||[]).slice();

      if(idx>=0) arr.splice(idx,1); else arr.push(cat);
      var anti=Object.assign({},dd.anti); anti[meal]=arr;
      writeDay(k3,{anti:anti});

    case 'day-save': saveDaySheet(d.k); break;

function afterChange(light){
  var got=award(dayKey());
  if(got.length) floatAward(got.length*CFG.PTS);
  refresh();
  if(light && !got.length) toast('已保存');
}

/* ============================================================ 引导完成 */
function finishOnboard(){
  var p={
    sex:OB.sex,age:+OB.age,heightCm:+OB.height,weightKg:+OB.weight,
    activity:OB.activity,bodyGoal:OB.bodyGoal,
    nickname:(OB.nickname||'').trim(),
    avatarKey:OB.avatarKey||'a01',hideRank:false,customExercises:[]
  };
  p.targets=calcTargets(p);
  S.profile=p;
  S.firstAt=Date.now();
  if(!S.buddies.length) seedBuddies();
  save();
  toast('档案已存好，开始吧');
  enterHome();
}
function seedBuddies(){
  S.buddies=[
    {id:'b1',name:'铁柱',av:2,day:20,week:210,total:1460},
    {id:'b2',name:'小满',av:3,day:40,week:260,total:1720},
    {id:'b3',name:'阿柯',av:5,day:10,week:180,total:1180}
  ];
}
function recalc(){
  if(!S.profile) return;
  S.profile.targets=calcTargets(S.profile);
  save();
}

/* ============================================================ 各弹层 */
function openMuscleSheet(name,sets,reps){
  var plan=(sets&&reps)?('<div class="sub" style="margin-bottom:8px">计划 '+sets+' 组 × '+reps+' 次</div>'):'';
  openSheet(shell(name,'选个时长和强度，写进今天',
    plan+
    '<div class="field__label">时长</div>'
    +'<div class="seg" id="mmin">'
    +[20,30,45,60].map(function(m,i){
      return '<div class="seg__i '+(i===1?'on':'')+'" data-min="'+m+'" style="height:34px">'+m+' 分</div>';
    }).join('')+'</div>'
    +'<div class="field__label mt3">强度</div>'
    +'<div class="seg" id="mint">'
    +[['easy','轻松'],['mid','适中'],['hard','力竭']].map(function(x,i){
      return '<div class="seg__i '+(i===1?'on':'')+'" data-int="'+x[0]+'" style="height:34px">'+x[1]+'</div>';
    }).join('')+'</div>',
    '<div class="btns mt3"><button class="btn" data-act="close">取消</button>'
    +'<button class="btn btn--gold" data-act="muscle-save" data-n="'+name+'"'
    +(sets?' data-sets="'+sets+'"':'')+(reps?' data-reps="'+reps+'"':'')+'>记下来</button></div>'));
  setTimeout(function(){
    ['mmin','mint'].forEach(function(id){
      var box=document.getElementById(id);
      if(!box)return;
      box.addEventListener('click',function(ev){
        var t=ev.target.closest('.seg__i'); if(!t)return;
        Array.prototype.forEach.call(box.children,function(c){c.classList.remove('on');});
        t.classList.add('on');
      });
    });
  },20);
}
function saveMuscle(){
  var box=document.getElementById('mmin');
  var sel=box&&box.querySelector('.seg__i.on');
  var minutes=sel?Number(sel.getAttribute('data-min')):30;
  var ib=document.getElementById('mint');
  var isel=ib&&ib.querySelector('.seg__i.on');
  var intensity=isel?isel.getAttribute('data-int'):'mid';
  var btn=document.querySelector('[data-act="muscle-save"]');
  var name=btn.getAttribute('data-n');
  var sets=btn.getAttribute('data-sets'), reps=btn.getAttribute('data-reps');
  var k=dayKey(), d=readDay(k);
  var list=d.muscle.slice();
  var rec={id:'m'+Date.now(),name:name,minutes:minutes,intensity:intensity};
  if(sets&&reps){ rec.sets=Number(sets); rec.reps=Number(reps); }
  list.push(rec);
  writeDay(k,{muscle:list});
  closeSheet(); afterChange();
  toast('已记一条 '+name);
}
function openCustomSheet(){
  openSheet(shell('新建动作','填名称、组数、每组次数',
    '<div class="field"><div class="field__label">动作名称（最多 12 字）</div>'
    +'<input class="inp" id="cname" maxlength="12" placeholder="例如：壶铃摇摆"></div>'
    +'<div class="row" style="gap:8px;margin-top:8px">'
    +'<div class="field grow" style="margin:0"><div class="field__label">做几组</div>'
    +'<input class="inp" id="csets" type="number" min="1" max="20" step="1" value="3"></div>'
    +'<div class="field grow" style="margin:0"><div class="field__label">每组几次</div>'
    +'<input class="inp" id="creps" type="number" min="1" max="100" step="1" value="12"></div>'
    +'</div><div class="sub mt2">会显示成「3 组 × 12 次」，之后记录时按这个做</div>',
    '<div class="btns mt2"><button class="btn" data-act="close">取消</button>'
    +'<button class="btn btn--gold" data-act="custom-save">保存</button></div>'));
}
function saveCustom(){
  var el=document.getElementById('cname');
  var sEl=document.getElementById('csets');
  var rEl=document.getElementById('creps');
  var nm=(el&&el.value||'').trim().slice(0,12);
  if(!nm){ toast('起个名字'); return; }
  var sets=Math.max(1,Math.min(20,Math.round(Number(sEl&&sEl.value)||3)));
  var reps=Math.max(1,Math.min(100,Math.round(Number(rEl&&rEl.value)||12)));
  if(!S.profile) return;
  S.profile.customExercises=S.profile.customExercises||[];
  var item=S.profile.customExercises.filter(function(x){return x.name===nm;})[0];
  if(item){ item.sets=sets; item.reps=reps; item.tip=sets+' 组 × '+reps+' 次'; }
  else S.profile.customExercises.push({name:nm,sets:sets,reps:reps,tip:sets+' 组 × '+reps+' 次'});
  save(); closeSheet(); route.p.tab='custom'; refresh();
  toast(nm+' 已加入：'+sets+' 组 × '+reps+' 次');
}

  var d=readDay(k);
  openSheet(shell(md(k)+' '+wd(k),'补记不算积分，只补数据',
    '<div class="row" style="gap:8px">'
    +'<div class="field grow" style="margin:0"><div class="field__label">体重 kg</div>'
    +'<input class="inp" id="d-w" type="number" step="0.1" value="'+(d.weightKg==null?'':d.weightKg)+'"></div>'
    +'<div class="field grow" style="margin:0"><div class="field__label">热量 千卡</div>'
    +'<input class="inp" id="d-c" type="number" value="'+(d.calories==null?'':d.calories)+'"></div></div>'
    +'<div class="sub mt2">那天：饮水 '+d.water.toFixed(1)+' 升 · 抗炎 '+antiCount(k)+' 类 · 睡眠 '
    +(d.sleep.durationMin?fmtDur(d.sleep.durationMin):'未记录')+'</div>',
    '<div class="btns mt2"><button class="btn" data-act="close">取消</button>'
    +'<button class="btn btn--gold" data-act="day-save" data-k="'+k+'">保存</button></div>'));
}
function saveDaySheet(k){
  var w=document.getElementById('d-w'), c=document.getElementById('d-c');
  writeDay(k,{
    weightKg:(w&&w.value!==''?Number(w.value):null),
    calories:(c&&c.value!==''?Number(c.value):null)
  });

}
function openNumSheet(kind){

function saveNum(){
  var el=document.getElementById('nums');
  var kind=document.querySelector('[data-act="num-save"]').getAttribute('data-k');

function addBuddy(){
  var pool=[['老王',1],['花卷',4],['大鹏',6],['阿泰',7],['小鹿',8],['石头',2]];
  var used=S.buddies.map(function(b){return b.name;});
  var pick=null;
  for(var i=0;i<pool.length;i++){ if(used.indexOf(pool[i][0])<0){pick=pool[i];break;} }
  if(!pick) pick=['搭子'+S.buddies.length,1];
  S.buddies.push({
    id:'b'+Date.now(),name:pick[0],av:pick[1],
    day:Math.floor(Math.random()*4)*10,
    week:Math.floor(Math.random()*26)*10+40,
    total:Math.floor(Math.random()*120)*10+400
  });
  save(); closeSheet(); route.p.t='day'; refresh();
  toast(pick[0]+' 已接受邀请');
}
function openNickSheet(){
  openSheet(shell('昵称与头像','',
    '<div class="field"><div class="field__label">昵称（榜上显示，最多 8 字）</div>'
    +'<input class="inp" id="nk" maxlength="8" value="'+nick()+'"></div>'
    +'<div class="field__label">头像</div><div class="row" style="gap:6px;flex-wrap:wrap" id="avp">'
    +[1,2,3,4,5,6,7,8].map(function(i){
      var on=avatarKey()==='a0'+i;
      return '<img src="'+AV+'a0'+i+'.png" data-av="a0'+i+'" style="width:34px;height:34px;border-radius:8px;'
        +'border:3px solid '+(on?HEX.gold:'#5E3C22')+';background:#F7E3BC;image-rendering:pixelated;cursor:pointer">';
    }).join('')+'</div>',
    '<div class="btns mt3"><button class="btn" data-act="close">取消</button>'
    +'<button class="btn btn--gold" data-act="nick-save">保存</button></div>'));
  setTimeout(function(){
    var box=document.getElementById('avp');
    if(!box)return;
    box.addEventListener('click',function(ev){
      var im=ev.target.closest('[data-av]'); if(!im)return;
      Array.prototype.forEach.call(box.children,function(c){c.style.borderColor='#5E3C22';});
      im.style.borderColor=HEX.gold;
      box.setAttribute('data-pick',im.getAttribute('data-av'));
    });

function saveNick(){
  var el=document.getElementById('nk');
  var box=document.getElementById('avp');
  if(!S.profile) return;
  S.profile.nickname=(el&&el.value||'').trim().slice(0,8);
  var pick=box&&box.getAttribute('data-pick');
  if(pick) S.profile.avatarKey=pick;
  save(); closeSheet(); refresh(); toast('已更新');
}
function openImportSheet(){
  openSheet(shell('从文本恢复','粘贴之前导出的 JSON，整体替换现有数据',
    '<textarea class="inp" id="imp" style="height:110px;padding:8px;font-size:11px;font-weight:400" '
    +'placeholder="粘贴备份内容…"></textarea>',
    '<div class="btns mt2"><button class="btn" data-act="close">取消</button>'
    +'<button class="btn btn--gold" data-act="import-do">恢复</button></div>'));
}
function doImport(){
  var el=document.getElementById('imp');
  var txt=(el&&el.value||'').trim();
  if(!txt){ toast('先粘贴内容'); return; }
  try{
    var obj=JSON.parse(txt);
    if(!obj||typeof obj!=='object'||!obj.days) throw new Error('bad');
    S=obj;
    if(!S.points)S.points=[]; if(!S.buddies)S.buddies=[];
    save(); closeSheet(); toast('已恢复');
    if(S.profile&&S.profile.targets) enterHome(); else refresh();
  }catch(err){
    toast('格式不对，现有数据没动');
  }
}

/* ============================================================ 备份 */
function exportJSON(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='大理论时代-备份-'+dayKey()+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  toast('已导出备份文件');
}
function copyJSON(){
  var txt=JSON.stringify(S);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast('已复制到剪贴板');},
      function(){toast('复制失败，请用导出文件');});
  }else{
    var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
    ta.select();try{document.execCommand('copy');toast('已复制');}catch(e){toast('复制失败');}
    ta.remove();
  }
}

/* ============================================================ 演示数据 / 重置 */
function seedData(){
  var end=dayKey();
  var wBase=68.6;
  for(var i=13;i>=0;i--){
    var k=addDays(end,-i);
    var wob=[0.4,0.1,-0.2,0.3,-0.1,0.2,0][i%7];
    var water=[1.2,1.5,1.8,1.0,2.0,1.5,1.6][i%7];
    var anti=[['berry','leafy'],['leafy','fish','nuts'],['berry','oil','protein'],['leafy','spice'],['fish','nuts','oil','fruitVc'],['berry','leafy','protein'],[ 'leafy','fish']][i%7];
    var bed=['23:10','23:40','00:20','22:50','23:30','01:00','23:00'][i%7];
    var wake=['07:00','07:10','07:40','06:50','08:00','08:20','07:20'][i%7];
    var mus=i%3===0?[{id:'s'+i+'-1',name:'深蹲',minutes:40,intensity:'mid'}]:
            (i%4===0?[{id:'s'+i+'-2',name:'卧推',minutes:35,intensity:'hard'}]:[]);
    var cal=[2380,2450,2210,2560,2300,2620,2280][i%7];
    var dd={water:water,anti:{breakfast:anti.slice(0,1),lunch:anti.slice(1),dinner:[]},
      sleep:{bed:bed,wake:wake,durationMin:durMin(bed,wake),quality:['good','fair','poor'][i%3]},
      muscle:mus,weightKg:Math.round((wBase-i*0.05+wob)*10)/10,calories:cal};
    S.days[k]=dd;
  }
  if(!S.profile){
    S.profile={sex:'male',age:30,heightCm:175,weightKg:67.9,activity:'moderate',
      bodyGoal:'thinMuscle',nickname:'',avatarKey:'a01',hideRank:false,customExercises:[]};
    S.profile.targets=calcTargets(S.profile);
  }
  if(!S.buddies.length) seedBuddies();

  /* 演示数据补积分：已发生的日期按当时完成情况发放 */
  var TODAY=dayKey();
  for(var j=13;j>=0;j--){
    var kk=addDays(TODAY,-j);
    ['water','anti','sleep','muscle'].forEach(function(m){
      if(isDone(m,kk)&&!hasPoint(kk,m)) S.points.push({date:kk,module:m,points:CFG.PTS});
    });
  }
  save();
  if(S.profile.targets) enterHome(); else refresh();
  toast('已填入 14 天演示数据');
}
function resetAll(){
  localStorage.removeItem(KEY);
  S={profile:null,days:{},points:[],buddies:[],firstAt:Date.now()};
  OB=null; stack=[]; layer=null;
  route={n:'splash',p:{}};
  refresh();
  toast('已清空');
}
function doJump(to){
  if(to==='onboard'){ OB={step:1,sex:'',age:'',height:'',weight:'',activity:'',bodyGoal:'',nickname:'',avatarKey:'a01'}; }
  if(to==='splash'){ stack=[]; route={n:'splash',p:{}}; refresh(); return; }
  if(TABS[to]){ tab(to); return; }
  go(to);
}

/* ============================================================ 启动 */
function tick(){
  var d=new Date();
  var el=document.getElementById('clock');
  if(el) el.textContent=d.getHours()+':'+pad(d.getMinutes());
}
function fit(){
  var sc=Math.min(1,(window.innerHeight-24)/760,(window.innerWidth-24)/375);
  if(window.innerWidth<=900) sc=Math.min(sc,(window.innerHeight-24)/760);
  document.documentElement.style.setProperty('--sc',sc.toFixed(3));
}
window.addEventListener('resize',fit);
fit(); tick(); setInterval(tick,20000);

if(S.profile&&S.profile.targets) route={n:'home',p:{}};
refresh();
})();
</script>
